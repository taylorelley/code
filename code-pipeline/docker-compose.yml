version: '3.8'

services:
  # Open WebUI main application
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
      - ./pipelines:/app/backend/pipelines  # Mount our Code pipeline
    environment:
      # Point to Code pipeline
      - OPENAI_API_BASE_URLS=http://code-pipeline:9099/v1
      - OPENAI_API_KEYS=dummy-key  # Code pipeline doesn't require auth
      - ENABLE_SIGNUP=true
      - WEBUI_NAME=Code WebUI
      # Auto-enable the code pipeline
      - ENABLE_COMMUNITY_SHARING=false
      - ENABLE_ADMIN_EXPORT=true
    depends_on:
      code-pipeline:
        condition: service_healthy
    networks:
      - webui-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Code Pipeline service
  code-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-pipeline
    ports:
      - "9099:9099"
    volumes:
      - code-workspace:/data/code-workspace
      - ./pipelines:/app/pipelines  # For development
      - ./utils:/app/utils  # For development
      # Mount Docker socket for sandboxing (optional but recommended)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CODE_BINARY_PATH=/usr/local/bin/code
      - CODE_WORKING_DIR=/data/code-workspace
      - PIPELINES_PORT=9099
      - LOG_LEVEL=info
      # Optional: API keys for Code's LLM providers
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    cap_add:
      - NET_ADMIN  # Required for network sysctl operations
    networks:
      - webui-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9099/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  open-webui-data:
    driver: local
  code-workspace:
    driver: local

networks:
  webui-network:
    driver: bridge
