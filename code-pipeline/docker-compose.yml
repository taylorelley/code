services:
  # Open WebUI main application
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
      - ./pipelines:/app/backend/pipelines  # Mount our Code pipeline
    environment:
      # Point to Code pipeline (using host.docker.internal since code-pipeline uses host networking)
      - OPENAI_API_BASE_URLS=http://host.docker.internal:9099/v1
      - OPENAI_API_KEYS=dummy-key  # Code pipeline doesn't require auth
      - ENABLE_SIGNUP=true
      - WEBUI_NAME=Code WebUI
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allow container to reach host
    depends_on:
      - code-pipeline
    networks:
      - webui-network

  # Code Pipeline service
  code-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-pipeline
    network_mode: host  # Use host networking to bypass container network initialization
    volumes:
      - code-workspace:/data/code-workspace
      - ./pipelines:/app/pipelines  # For development
      - ./utils:/app/utils  # For development
      # Mount Docker socket for sandboxing (optional but recommended)
      # - /var/run/docker.sock:/var/run/docker.sock  # Temporarily disabled
    environment:
      - CODE_BINARY_PATH=/usr/local/bin/code
      - CODE_WORKING_DIR=/data/code-workspace
      - PIPELINES_PORT=9099
      - LOG_LEVEL=info
      # Optional: API keys for Code's LLM providers
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # privileged: true  # Not needed with host networking

volumes:
  open-webui-data:
    driver: local
  code-workspace:
    driver: local

networks:
  webui-network:
    driver: bridge
